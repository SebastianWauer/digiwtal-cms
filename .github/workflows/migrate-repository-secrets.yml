name: Einmalige Repository-Secret-Migration

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.REPOSITORY_MIGRATION_TOKEN }}
      SOURCE_DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      SOURCE_DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SOURCE_DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      SOURCE_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SOURCE_DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      SOURCE_VERWALTUNG_URL: ${{ secrets.VERWALTUNG_URL }}
      SOURCE_VERWALTUNG_CI_TOKEN: ${{ secrets.VERWALTUNG_CI_TOKEN }}
    steps:
      - name: Voraussetzungen pruefen
        run: |
          set -euo pipefail
          for name in GH_TOKEN SOURCE_DEPLOY_HOST SOURCE_DEPLOY_PATH SOURCE_DEPLOY_PORT \
            SOURCE_DEPLOY_SSH_KEY SOURCE_DEPLOY_USER SOURCE_VERWALTUNG_URL \
            SOURCE_VERWALTUNG_CI_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Erforderlicher Wert $name fehlt."
              exit 1
            fi
          done

      - name: Verwaltungs-Secrets uebertragen
        run: |
          set -euo pipefail
          TARGET=SebastianWauer/digiwtal-verwaltung
          printf '%s' "$SOURCE_DEPLOY_HOST" | gh secret set DEPLOY_HOST --repo "$TARGET"
          printf '%s' "${SOURCE_DEPLOY_PATH%/}/Verwaltung" | gh secret set DEPLOY_PATH --repo "$TARGET"
          printf '%s' "$SOURCE_DEPLOY_PORT" | gh secret set DEPLOY_PORT --repo "$TARGET"
          printf '%s' "$SOURCE_DEPLOY_SSH_KEY" | gh secret set DEPLOY_SSH_KEY --repo "$TARGET"
          printf '%s' "$SOURCE_DEPLOY_USER" | gh secret set DEPLOY_USER --repo "$TARGET"
          printf '%s' "$SOURCE_VERWALTUNG_URL" | gh secret set VERWALTUNG_URL --repo "$TARGET"
          printf '%s' "$SOURCE_VERWALTUNG_CI_TOKEN" | gh secret set VERWALTUNG_CI_TOKEN --repo "$TARGET"

      - name: Frontend-Secrets uebertragen
        run: |
          set -euo pipefail
          for TARGET in SebastianWauer/frontend-sport-voice SebastianWauer/frontend-digiwtal; do
            printf '%s' "$SOURCE_VERWALTUNG_URL" | gh secret set VERWALTUNG_URL --repo "$TARGET"
            printf '%s' "$SOURCE_VERWALTUNG_CI_TOKEN" | gh secret set VERWALTUNG_CI_TOKEN --repo "$TARGET"
          done
