name: Deploy to IONOS

# Rollt ausschliesslich das gemeinsame CMS auf den Webspace eines Kunden aus.
# Kundenfrontends leben in eigenen Repositories und werden von diesem Workflow
# weder gelesen noch veraendert.
#
# Warum ueber CI und nicht aus der Verwaltung heraus: Auf IONOS-Webspace fehlt
# die ssh2-Erweiterung, eine nutzbare Shell gibt es nicht, und der FTP-Port ist
# geschlossen. Die Verwaltung hat dort also keine Transfermethode. Sie bleibt
# aber die Steuerzentrale - dieser Workflow holt sich Zugangsdaten, Pfade,
# URLs und Tokens bei ihr ab, statt sie ein zweites Mal in GitHub zu pflegen.
#
# Deshalb braucht GitHub nur zwei Secrets, ein fuer alle Mal:
#   VERWALTUNG_URL       z.B. https://verwaltung.digiwtal.de
#   VERWALTUNG_CI_TOKEN  in der Verwaltung unter CI-Tokens erzeugt
#
# Alles andere - welcher Kunde, welcher Host, welche Datenbank - steht im
# Vault der Verwaltung und wird zur Laufzeit geholt.

on:
  workflow_dispatch:
    inputs:
      kunde:
        description: "Kunden-ID aus der Verwaltung"
        required: true
        type: string
      migrationen:
        description: "Migrationen nach dem Upload ausfuehren"
        type: boolean
        default: true

concurrency:
  group: deploy-kunde-${{ inputs.kunde }}
  cancel-in-progress: false

jobs:
  ausrollen:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Konfiguration aus der Verwaltung holen
        env:
          VERWALTUNG_URL: ${{ secrets.VERWALTUNG_URL }}
          CI_TOKEN: ${{ secrets.VERWALTUNG_CI_TOKEN }}
        run: |
          set -euo pipefail

          STATUS=$(curl -sS --max-time 30 -o /tmp/ziel.json -w '%{http_code}' \
            -H "X-Ci-Token: $CI_TOKEN" \
            "${VERWALTUNG_URL%/}/api/ci/deploy-target?customer=${{ inputs.kunde }}")

          if [ "$STATUS" != "200" ]; then
            echo "::error::Verwaltung antwortete mit HTTP $STATUS"
            # Fehlerobjekt enthaelt keine Geheimnisse, darf also ins Log
            cat /tmp/ziel.json || true
            exit 1
          fi

          # Geheimnisse maskieren, bevor irgendetwas davon im Log landen kann
          for pfad in .ssh.password .db.password .tokens.health .tokens.deploy .tokens.migration .tokens.setup .tokens.api .support.token; do
            wert=$(jq -r "$pfad // empty" /tmp/ziel.json)
            [ -n "$wert" ] && echo "::add-mask::$wert"
          done

          {
            echo "KUNDE_NAME=$(jq -r '.customer.name' /tmp/ziel.json)"
            echo "SSH_HOST=$(jq -r '.ssh.host' /tmp/ziel.json)"
            echo "SSH_PORT=$(jq -r '.ssh.port' /tmp/ziel.json)"
            echo "SSH_USER=$(jq -r '.ssh.user' /tmp/ziel.json)"
            echo "SSHPASS=$(jq -r '.ssh.password' /tmp/ziel.json)"
            echo "CMS_PATH=$(jq -r '.ssh.cms_path' /tmp/ziel.json)"
            echo "FRONTEND_PATH=$(jq -r '.ssh.frontend_path' /tmp/ziel.json)"
            echo "CMS_URL=$(jq -r '.urls.cms' /tmp/ziel.json)"
            echo "FRONTEND_URL=$(jq -r '.urls.frontend' /tmp/ziel.json)"
            echo "CMS_BASE_PATH=$(jq -r '.urls.base_path // ""' /tmp/ziel.json)"
            echo "CMS_EMBEDDED=$(jq -r '.urls.embedded // false' /tmp/ziel.json)"
            echo "HEALTH_TOKEN=$(jq -r '.tokens.health' /tmp/ziel.json)"
            echo "UPDATES_AVAILABLE_UNTIL=$(jq -r '.customer.updates_available_until // "unlimited"' /tmp/ziel.json)"
          } >> "$GITHUB_ENV"

          echo "Ziel: $(jq -r '.customer.name' /tmp/ziel.json) (Kunde ${{ inputs.kunde }})"
          echo "CMS-Version im Repo: $(php -r 'echo (include "config/version.php")["cms_version"] ?? "unbekannt";')"

      - name: SSH vorbereiten
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          echo "SSH_CMD=sshpass -e ssh -p $SSH_PORT" >> "$GITHUB_ENV"

      - name: Vorpruefung
        run: |
          set -euo pipefail

          # Fuenf der sechs Fehlversuche beim ersten Rollout gingen auf leere
          # oder falsche Felder im Serverzugang zurueck - und meldeten sich als
          # "rsync protocol data stream (code 12)". Hier heissen sie beim Namen,
          # bevor irgendetwas uebertragen wird.
          for feld in SSH_HOST SSH_USER SSHPASS CMS_PATH FRONTEND_PATH; do
            if [ -z "${!feld:-}" ]; then
              echo "::error::$feld ist leer. Im Serverzugang der Verwaltung nachtragen."
              exit 1
            fi
          done

          # Ein leeres Health-Token wandert sonst als leerer Wert in die .env -
          # das CMS behandelt eine leere Erwartung als "verboten", und der
          # Health-Endpunkt antwortet danach dauerhaft 403. Die Instanz gilt
          # als ungesund, obwohl sie laeuft.
          if [ -z "${HEALTH_TOKEN:-}" ]; then
            echo "::error::Kein Health-Token im Serverzugang hinterlegt. Ohne das Token ist die Instanz nicht ueberwachbar."
            exit 1
          fi

          case "$CMS_PATH" in
            /CMS|/Frontend|/|"")
              echo "::error::Zielpfad ist '$CMS_PATH' - das ist das Wurzelverzeichnis des Servers."
              echo "::error::Im Serverzugang den Basis-Pfad setzen, z.B. /home/www."
              exit 1
              ;;
          esac

          if [[ ! "$CMS_PATH" =~ ^[A-Za-z0-9._~/:+-]+$ ]] \
            || [[ ! "$FRONTEND_PATH" =~ ^[A-Za-z0-9._~/:+-]+$ ]]; then
            echo "::error::CMS- oder Frontend-Zielpfad enthaelt ungueltige Zeichen."
            exit 1
          fi

          if [ "$CMS_EMBEDDED" = "true" ]; then
            if [[ ! "$CMS_BASE_PATH" =~ ^/([A-Za-z0-9._~-]+/)*[A-Za-z0-9._~-]+$ ]] \
              || [[ "$CMS_BASE_PATH" == *"/../"* ]] \
              || [[ "$CMS_BASE_PATH" == "/.." ]] \
              || [[ "$CMS_BASE_PATH" == *"/." ]]; then
              echo "::error::Ungueltiger CMS-Basis-Pfad: '$CMS_BASE_PATH'."
              exit 1
            fi
            CMS_PUBLIC_PATH="${FRONTEND_PATH%/}${CMS_BASE_PATH}"
            echo "CMS_PUBLIC_PATH=$CMS_PUBLIC_PATH" >> "$GITHUB_ENV"
            echo "CMS wird zusaetzlich unter $CMS_PUBLIC_PATH an die Hauptdomain angebunden."
          fi

          if ! $SSH_CMD "$SSH_USER@$SSH_HOST" "true" 2>/tmp/ssh-fehler.txt; then
            echo "::error::SSH-Anmeldung fehlgeschlagen. Server-Passwort im Serverzugang pruefen."
            cat /tmp/ssh-fehler.txt || true
            exit 1
          fi

          # rsync legt nur die letzte Ebene an. Fehlt der Ordner darueber,
          # bricht die Uebertragung mit "No such file or directory" ab.
          if [ "$CMS_EMBEDDED" = "true" ]; then
            $SSH_CMD "$SSH_USER@$SSH_HOST" \
              "mkdir -p '$CMS_PATH' '$CMS_PUBLIC_PATH'"
          else
            $SSH_CMD "$SSH_USER@$SSH_HOST" \
              "mkdir -p '$CMS_PATH'"
          fi

          echo "Anmeldung ok. Zielverzeichnisse vorhanden:"
          $SSH_CMD "$SSH_USER@$SSH_HOST" "pwd; ls -ld '$CMS_PATH'"

          if ! $SSH_CMD "$SSH_USER@$SSH_HOST" "command -v rsync >/dev/null"; then
            echo "::error::Auf dem Zielserver fehlt rsync. Die Uebertragung braucht es auf beiden Seiten."
            exit 1
          fi

      - name: Dateien uebertragen
        run: |
          set -euo pipefail
          # --delete raeumt im Zielordner auf. Ausgeschlossene Pfade bleiben
          # unangetastet - NICHT --delete-excluded verwenden, das wuerde .env
          # und storage/ auf dem Zielserver loeschen.
          COMMON="--archive --compress --delete --human-readable
            --exclude=.git/ --exclude=.github/ --exclude=.env --exclude=.claude/
            --exclude=storage/ --exclude=/vendor/ --exclude=node_modules/
            --exclude=secrets/ --exclude=keys/ --exclude=*.zip --exclude=upload.sh"

          echo "::group::CMS"
          rsync $COMMON -e "$SSH_CMD" ./ "$SSH_USER@$SSH_HOST:$CMS_PATH/"
          echo "::endgroup::"

          if [ "$CMS_EMBEDDED" = "true" ]; then
            echo "::group::CMS-Pfadanbindung"
            CMS_PUBLIC_STAGE=$(mktemp -d)
            cp -a ./public/. "$CMS_PUBLIC_STAGE/"
            # mktemp erzeugt Verzeichnisse mit 700. Da rsync --archive die
            # Rechte uebernimmt, muss der Staging-Baum vor dem Upload fuer den
            # Webserver lesbar sein; sonst antwortet Apache auf /cms mit 403.
            chmod 755 "$CMS_PUBLIC_STAGE"
            find "$CMS_PUBLIC_STAGE" -type d -exec chmod 755 {} +
            find "$CMS_PUBLIC_STAGE" -type f -exec chmod 644 {} +
            cat >> "$CMS_PUBLIC_STAGE/.htaccess" <<EOF

          # BEGIN DIGIWTAL CMS PATH DEPLOYMENT
          <IfModule mod_env.c>
            SetEnv CMS_APP_ROOT $CMS_PATH
            SetEnv CMS_BASE_PATH $CMS_BASE_PATH
          </IfModule>
          # END DIGIWTAL CMS PATH DEPLOYMENT
          EOF

            rsync $COMMON -e "$SSH_CMD" "$CMS_PUBLIC_STAGE/" "$SSH_USER@$SSH_HOST:$CMS_PUBLIC_PATH/"
            $SSH_CMD "$SSH_USER@$SSH_HOST" \
              "chmod 755 '$CMS_PUBLIC_PATH' && find '$CMS_PUBLIC_PATH' -type d -exec chmod 755 {} + && find '$CMS_PUBLIC_PATH' -type f -exec chmod 644 {} +"
            rm -rf -- "$CMS_PUBLIC_STAGE"
            echo "CMS-public nach $CMS_PUBLIC_PATH gespiegelt. Das Kundenfrontend blieb unveraendert."
            echo "::endgroup::"
          fi

      - name: CMS-.env aus der Verwaltung synchronisieren
        run: |
          set -euo pipefail

          php .github/scripts/render-env.php cms /tmp/ziel.json > /tmp/cms.env

          ziel="$SSH_USER@$SSH_HOST"
          $SSH_CMD "$ziel" "if test -f '$CMS_PATH/.env'; then cat '$CMS_PATH/.env'; fi" > /tmp/cms-current.env

          # Nur Schluessel aus der Verwaltung ersetzen. Zusaetzliche Werte wie
          # Instagram-Konfigurationen bleiben unveraendert erhalten.
          awk -F= '
            NR == FNR {
              key = $1
              if (!(key in managed)) order[++count] = key
              managed[key] = $0
              next
            }
            {
              key = $1
              if (key in managed) {
                if (!(key in written)) print managed[key]
                written[key] = 1
                next
              }
              print
            }
            END {
              for (i = 1; i <= count; i++) {
                key = order[i]
                if (!(key in written)) print managed[key]
              }
            }
          ' /tmp/cms.env /tmp/cms-current.env > /tmp/cms-merged.env

          $SSH_CMD "$ziel" "cat > '$CMS_PATH/.env.new' && chmod 600 '$CMS_PATH/.env.new' && mv '$CMS_PATH/.env.new' '$CMS_PATH/.env'" < /tmp/cms-merged.env
          $SSH_CMD "$ziel" "mkdir -p '$CMS_PATH/storage' && chmod 755 '$CMS_PATH/storage'"
          echo "CMS-.env aus der Verwaltung synchronisiert; eigene Zusatzwerte wurden erhalten."

      - name: Migrationen ausfuehren
        if: ${{ inputs.migrationen }}
        run: |
          set -euo pipefail
          $SSH_CMD "$SSH_USER@$SSH_HOST" "cd '$CMS_PATH' && php scripts/migrate.php"

      - name: Health pruefen und an die Verwaltung melden
        if: ${{ always() && env.CMS_URL != '' && env.HEALTH_TOKEN != '' }}
        env:
          VERWALTUNG_URL: ${{ secrets.VERWALTUNG_URL }}
          CI_TOKEN: ${{ secrets.VERWALTUNG_CI_TOKEN }}
        run: |
          set -euo pipefail

          HEALTH_URL="${CMS_URL%/}/api.php/api/health"
          START_NS=$(date +%s%N)
          HTTP_CODE=$(curl -sS --max-time 15 -o /tmp/cms-health.json -w '%{http_code}' \
            -H "X-Health-Token: $HEALTH_TOKEN" \
            -H "Accept: application/json" \
            "$HEALTH_URL" || true)
          END_NS=$(date +%s%N)
          RESPONSE_MS=$(( (END_NS - START_NS) / 1000000 ))
          HTTP_CODE=$((10#${HTTP_CODE:-0}))

          if ! jq -e . /tmp/cms-health.json >/dev/null 2>&1; then
            echo '{}' > /tmp/cms-health.json
          fi

          jq -n \
            --arg kunde "${{ inputs.kunde }}" \
            --arg url "$HEALTH_URL" \
            --argjson http "${HTTP_CODE:-0}" \
            --argjson ms "$RESPONSE_MS" \
            --slurpfile body /tmp/cms-health.json \
            '{source:"rollout",results:[{customer:($kunde|tonumber),cms:{url:$url,http_code:$http,response_ms:$ms,error:null,body:$body[0]},frontend:{checked:false}}]}' \
            > /tmp/report.json

          STATUS=$(curl -sS --max-time 30 -o /tmp/antwort.json -w '%{http_code}' \
            -X POST \
            -H "X-Ci-Token: $CI_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/report.json \
            "${VERWALTUNG_URL%/}/api/ci/health-report")

          if [ "$STATUS" != "200" ]; then
            echo "::error::Verwaltung nahm den Health-Report nicht an, HTTP $STATUS"
            cat /tmp/antwort.json || true
            exit 1
          fi

          ERGEBNIS=$(jq -r '.recorded[0].status // "unbekannt"' /tmp/antwort.json)
          echo "$KUNDE_NAME meldet: $ERGEBNIS (in der Verwaltung gespeichert)"

          if [ "$ERGEBNIS" != "healthy" ]; then
            echo "::error::$KUNDE_NAME meldet '$ERGEBNIS' statt 'healthy'."
            jq -r '.results[0].cms | "HTTP \(.http_code) auf \(.url)"' /tmp/report.json
            exit 1
          fi
